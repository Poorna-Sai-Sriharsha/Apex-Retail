version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: store_intelligence_db
    environment:
      POSTGRES_USER: apex
      POSTGRES_PASSWORD: apex_secret
      POSTGRES_DB: store_intelligence
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex -d store_intelligence"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: store_intelligence_api
    environment:
      DATABASE_URL: postgresql+asyncpg://apex:apex_secret@db:5432/store_intelligence
      LOG_LEVEL: INFO
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      STORE_IDS: STORE_BLR_001
      STALE_FEED_MINUTES: "10"
      REID_SIMILARITY_THRESHOLD: "0.75"
      REID_REENTRY_WINDOW_MINUTES: "30"
      ZONE_DWELL_INTERVAL_SECONDS: "30"
      POS_CORRELATION_WINDOW_MINUTES: "5"
      QUEUE_SPIKE_MULTIPLIER: "2.0"
      CONVERSION_DROP_THRESHOLD: "0.70"
      DEAD_ZONE_MINUTES: "30"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pipeline_output:/app/pipeline/output
      - ./pipeline/store_layouts:/app/pipeline/store_layouts:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
  pipeline_output:

networks:
  default:
    name: store_intelligence_network
